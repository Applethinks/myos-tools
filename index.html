<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYOS Tools - Free Online Tools</title>
    <link rel="stylesheet" href="style.css">
</head><body><header>
    <div class="logo">MYOS<span>.</span></div>
    <p>Free Online Tools</p>
</header><main>
    <div class="badge">FREE ONLINE TOOL</div><h1>Text <span>Counter</span></h1>

<p class="description">
    Count words, characters, sentences and paragraphs instantly.
    Simple, fast and completely free.
</p>

<div class="tool">

    <textarea id="textInput"
    placeholder="Start typing or paste your text here..."></textarea>

    <div class="stats">

        <div class="stat">
            <h2 id="words">0</h2>
            <p>Words</p>
        </div>

        <div class="stat">
            <h2 id="characters">0</h2>
            <p>Characters</p>
        </div>

        <div class="stat">
            <h2 id="sentences">0</h2>
            <p>Sentences</p>
        </div>

        <div class="stat">
            <h2 id="paragraphs">0</h2>
            <p>Paragraphs</p>
        </div>

    </div>

    <div class="buttons">
        <button class="copy" id="copyBtn">Copy Text</button>
        <button class="clear" id="clearBtn">Clear</button>
    </div>

</div>

</main><footer>
    Made with <span>MYOS</span> · Make Your Own Site
    <br><br>
    © 2026 MYOS Tools
</footer><script src="script.js"></script></body>
</html>
